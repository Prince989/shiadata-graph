hadith:
  pipeline: hadith
  description: Al-Kafi volumes
  globs:
    - hadith/al-kafi-*.txt

vasael-o-shia:
  pipeline: hadith
  description: Wasa'il al-Shia volumes
  globs:
    - hadith/vasael-o-shia-*.txt

sahifa:
  pipeline: hadith
  description: Al-Sahifa al-Sajjadiyya (add files under hadith/ or sahifa/)
  globs:
    - hadith/*sahifa*
    - sahifa/**
    - "**/*sahifa*"

al-mizan:
  pipeline: tafsir
  source_lang: fa
  description: Al-Mizan tafsir
  globs:
    - tafsir/al-mizan.txt

noor:
  pipeline: tafsir
  source_lang: fa
  description: Tafsir-e Noor
  globs:
    - tafsir/noor.txt

nemune:
  pipeline: tafsir
  source_lang: fa
  description: Tafsir-e Nemune
  globs:
    - tafsir/nemune.txt


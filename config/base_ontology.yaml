  # --- mid-grain concepts (seed; grow via aliases, not re-extraction) ---
  - id: الانتحار
    pref: الانتحار
    aliases: [قتل النفس, قتل نفسه]
    broader: الموت
  - id: عذاب_البرزخ
    pref: عذاب البرزخ
    aliases: [عذاب القبر]
    broader: المعاد
  - id: الجزاء_الأخروي
    pref: الجزاء الأخروي
    aliases: [الجزاء الأخروي, الثواب والعقاب]
    broader: المعاد
  - id: العقل
    pref: العقل
    aliases: [عقول]
  - id: الجهل
    pref: الجهل
  - id: النكراء
    pref: النكراء
    aliases: [الشيطنة]
  - id: العبادة
    pref: العبادة
  # Hadith 10 is the locus classicus for وسواس; without a catalog row it stayed
  # a singleton and let الشيطان hold the primary slot instead.
  - id: الوسواس
    pref: الوسواس
    aliases: [الوسوسة, وسواس]
  - id: الحياء
    pref: الحياء
  - id: الدين
    pref: الدين
    aliases: [التدين]
  - id: العلم
    pref: العلم
  - id: الوضوء
    pref: الوضوء
    broader: الصلاة
  - id: الجنة
    pref: الجنة
    aliases: [الجنان]
    broader: المعاد
  # الحساب / الثواب / الجزاء are NOT synonyms -- reckoning, reward and
  # recompense are three different things and aliasing them would erase the
  # distinction permanently. They share a parent instead, so hadiths 7, 8 and 9
  # meet in the الجزاء الأخروي bucket while staying separately searchable.
  - id: الحساب
    pref: الحساب
    aliases: [حساب القيامة]
    broader: [الجزاء الأخروي, القيامة]
  - id: الثواب
    pref: الثواب
    aliases: [الأجر, المثوبة]
    broader: الجزاء الأخروي
  - id: الجزاء
    pref: الجزاء
    aliases: [المجازاة]
    broader: الجزاء الأخروي
  - id: العقاب
    pref: العقاب
    aliases: [العقوبة]
    broader: الجزاء الأخروي
  # Deliberately NOT aliased from a bare محبة: that would swallow محبة الدنيا,
  # which is its opposite. Only unambiguous surface forms are listed.
  - id: محبة_أهل_البيت
    pref: محبة أهل البيت
    aliases: [مودة أهل البيت, حب أهل البيت, مودة القربى, ولاء أهل البيت]
    broader: الولاية
  - {id: النبوة, pref: النبوة}
  - {id: العزيمة, pref: العزيمة}
